name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      LLM_PROVIDER: mock
      TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: >-
          uv run mypy src
          scripts/generate_activation_manifest.py
          scripts/staging_smoke.py
          scripts/qdrant_activation.py
          scripts/neo4j_activation.py
      - name: Unit and integration tests
        run: >-
          uv run pytest
          --ignore=tests/test_data_lineage.py
          --ignore=tests/test_rag_generator.py
          --ignore=tests/test_rag_pipeline.py
          --junitxml=junit.xml
          --cov=src/company_graphrag --cov-report=xml --cov-report=html
      - name: Version consistency
        run: uv run company-graphrag version-check
      - name: Representative eval regression
        run: uv run company-graphrag eval-regression-check
      - name: Activation manifest
        run: uv run python scripts/generate_activation_manifest.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: quality-reports
          path: |
            junit.xml
            coverage.xml
            htmlcov/
            artifacts/evaluation/
            artifacts/production_activation/activation_manifest.json
          if-no-files-found: warn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: company-graphrag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root image
        run: test "$(docker image inspect company-graphrag:ci --format '{{.Config.User}}')" = "appuser"
      - name: Container smoke
        run: ./scripts/container_smoke.sh company-graphrag:ci
      - name: Clean core startup and readiness
        run: |
          docker tag company-graphrag:ci company-graphrag:latest
          docker compose --profile core up -d --no-build --wait
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8000/health/ready
      - name: Dependency failure readiness
        run: |
          docker compose stop qdrant
          test "$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/health/ready)" = "503"
          docker compose start qdrant
      - name: Core logs
        if: always()
        run: docker compose --profile core logs --no-color > core-services.log
      - name: Core cleanup
        if: always()
        run: docker compose --profile core down --volumes
      - name: Trivy critical scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: company-graphrag:ci
          format: json
          output: trivy.json
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy visibility report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: company-graphrag:ci
          format: table
          output: trivy-table.txt
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: company-graphrag:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-chain-reports
          path: |
            trivy.json
            trivy-table.txt
            sbom.spdx.json
            core-services.log

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
