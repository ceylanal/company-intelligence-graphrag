name: Staging Evaluation Baseline

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Deployed immutable image digest
        required: true
        type: string
      max_samples:
        description: Bounded number of frozen test samples
        required: true
        default: "34"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Resolve private staging URL
        id: service
        env:
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format 'value(status.url)')
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        id: invoke-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.service_url }}
          id_token_include_email: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Run frozen staging baseline
        env:
          GOOGLE_IDENTITY_TOKEN: ${{ steps.invoke-auth.outputs.id_token }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          MAX_SAMPLES: ${{ inputs.max_samples }}
          SERVICE_URL: ${{ steps.service.outputs.service_url }}
        run: |
          uv sync --frozen
          API_KEY=$(gcloud secrets versions access latest \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --secret company-graphrag-api-key)
          echo "::add-mask::$API_KEY"
          API_KEY="$API_KEY" uv run python scripts/staging_baseline.py \
            --base-url "$SERVICE_URL" \
            --image-digest "$IMAGE_DIGEST" \
            --max-samples "$MAX_SAMPLES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-eval-baseline
          path: artifacts/production_activation/evals/
          if-no-files-found: error
