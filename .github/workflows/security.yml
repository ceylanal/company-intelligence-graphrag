name: Scheduled Security

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs.json
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
      - name: Gitleaks repository scan
        if: always()
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload scheduled security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scheduled-security
          path: trivy-fs.json
          if-no-files-found: warn
      - name: Enforce Trivy HIGH and CRITICAL gate
        if: always()
        run: |
          test -s trivy-fs.json
          findings="$(
            jq '[
              .Results[]?
              | ((.Vulnerabilities // []) + (.Misconfigurations // []) + (.Secrets // []))
              | .[]
            ] | length' trivy-fs.json
          )"
          test "$findings" -eq 0
