name: Backup Verification

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Connect to staging services and create inventories
        required: true
        default: false
        type: boolean
      migrate_qdrant:
        description: Execute the idempotent Qdrant Cloud data migration
        required: false
        default: false
        type: boolean
      migrate_neo4j:
        description: Execute the idempotent Neo4j Aura graph migration
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    environment: staging
    services:
      neo4j-restore:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/restore-rehearsal-password
        ports:
          - 7687:7687
    env:
      QDRANT_URL: ${{ vars.QDRANT_URL }}
      QDRANT_COLLECTION_NAME: ${{ vars.QDRANT_COLLECTION_NAME }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      NEO4J_URI: ${{ vars.NEO4J_URI }}
      NEO4J_USERNAME: ${{ vars.NEO4J_USERNAME }}
      NEO4J_DATABASE: ${{ vars.NEO4J_DATABASE }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_RESTORE_PASSWORD: restore-rehearsal-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Validate scripts
        run: |
          uv run python scripts/qdrant_activation.py --help
          uv run python scripts/neo4j_activation.py --help
          uv run python scripts/neo4j_logical_restore_rehearsal.py --help
      - name: Migrate Qdrant staging collection
        if: inputs.migrate_qdrant
        run: |
          uv run python scripts/embed_chunks.py data/processed/chunks \
            --collection-name "$QDRANT_COLLECTION_NAME" \
            --qdrant-url "$QDRANT_URL" \
            --batch-size 64
      - name: Migrate Neo4j Aura staging graph
        if: inputs.migrate_neo4j
        run: |
          uv run python scripts/neo4j_activation.py migrate \
            --uri "$NEO4J_URI" \
            --username "$NEO4J_USERNAME" \
            --database "$NEO4J_DATABASE" \
            --input-dir data/graph/sample_day19 \
            --checkpoint artifacts/production_activation/neo4j/staging-migration-checkpoint.json \
            --execute \
            --output artifacts/production_activation/neo4j/cloud-migration-result.json
      - name: Inventory staging databases
        if: inputs.execute || inputs.migrate_qdrant || inputs.migrate_neo4j
        run: |
          uv run python scripts/qdrant_activation.py inventory \
            --url "$QDRANT_URL" \
            --collection "$QDRANT_COLLECTION_NAME" \
            --output artifacts/production_activation/qdrant/cloud-inventory.json
          uv run python scripts/neo4j_activation.py inventory \
            --uri "$NEO4J_URI" \
            --username "$NEO4J_USERNAME" \
            --database "$NEO4J_DATABASE" \
            --output artifacts/production_activation/neo4j/cloud-inventory.json
      - name: Rehearse Qdrant snapshot restore in isolated collection
        if: inputs.execute
        run: |
          uv run python scripts/qdrant_snapshot_rehearsal.py \
            --url "$QDRANT_URL" \
            --source-collection "$QDRANT_COLLECTION_NAME" \
            --restore-collection company_documents_staging_restore_rehearsal_v2 \
            --output artifacts/production_activation/disaster_recovery/qdrant-restore.json \
            --execute
      - name: Rehearse Neo4j Aura logical restore in isolated database
        if: inputs.execute
        run: |
          uv run python scripts/neo4j_logical_restore_rehearsal.py \
            --source-uri "$NEO4J_URI" \
            --source-username "$NEO4J_USERNAME" \
            --source-database "$NEO4J_DATABASE" \
            --target-uri bolt://localhost:7687 \
            --target-username neo4j \
            --target-database neo4j \
            --output artifacts/production_activation/disaster_recovery/neo4j-logical-restore.json \
            --execute
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backup-verification
          path: artifacts/production_activation/
          if-no-files-found: warn
