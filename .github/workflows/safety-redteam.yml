name: Safety Red-Team Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Enforce deterministic safety release gate
        run: uv run python scripts/run_safety_eval.py
      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safety-redteam-evidence
          path: artifacts/safety/day54/
          if-no-files-found: error
