name: Deploy Cloud Run Staging

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Existing signed image digest (sha256:...)
        required: true
        type: string
      execute:
        description: Execute deployment (false validates configuration only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate immutable digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: test "${IMAGE_DIGEST#sha256:}" != "${IMAGE_DIGEST}" && test "${#IMAGE_DIGEST}" -eq 71
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: inputs.execute
        id: gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: inputs.execute
      - name: Deploy guarded staging revision
        if: inputs.execute
        id: deploy
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          ARTIFACT_REGISTRY_IMAGE: ${{ vars.ARTIFACT_REGISTRY_IMAGE }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_COLLECTION_NAME: ${{ vars.QDRANT_COLLECTION_NAME }}
          NEO4J_URI: ${{ vars.NEO4J_URI }}
          NEO4J_USERNAME: ${{ vars.NEO4J_USERNAME }}
          NEO4J_DATABASE: ${{ vars.NEO4J_DATABASE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPIK_WORKSPACE: ${{ vars.OPIK_WORKSPACE }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          ./scripts/deploy_cloud_run.sh
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format 'value(status.url)')
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        if: inputs.execute
        id: smoke-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: inputs.execute
        with:
          enable-cache: true
      - name: Run staging smoke validation
        if: inputs.execute
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          GOOGLE_IDENTITY_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
        run: |
          uv sync --frozen
          API_KEY=$(gcloud secrets versions access latest \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --secret company-graphrag-api-key)
          echo "::add-mask::$API_KEY"
          API_KEY="$API_KEY" uv run python scripts/staging_smoke.py \
            --base-url "$SERVICE_URL" \
            --research-query "ASELSAN 2024 toplam hasılatı ve ilgili yönetici hakkında kaynaklı kısa bir özet ver."
      - name: Run frozen staging evaluation baseline
        if: inputs.execute
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          GOOGLE_IDENTITY_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          API_KEY=$(gcloud secrets versions access latest \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --secret company-graphrag-api-key)
          echo "::add-mask::$API_KEY"
          API_KEY="$API_KEY" uv run python scripts/staging_baseline.py \
            --base-url "$SERVICE_URL" \
            --image-digest "$IMAGE_DIGEST" \
            --run-scope "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --dataset data/evals/staging_acceptance.jsonl \
            --max-samples 18 \
            --min-correctness 0.90 \
            --min-citation-correctness 0.90 \
            --min-multi-hop-success 0.80 \
            --max-hallucination 0.10
      - name: Run bounded 1, 5, and 10 user load stages
        if: inputs.execute
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          GOOGLE_IDENTITY_TOKEN: ${{ steps.smoke-auth.outputs.id_token }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          mkdir -p artifacts/production_activation/load
          for users in 1 5 10; do
            uv run locust \
              -f tests/load/locustfile.py \
              --headless \
              --host "$SERVICE_URL" \
              --tags normal \
              --users "$users" \
              --spawn-rate "$users" \
              --run-time 20s \
              --csv "artifacts/production_activation/load/users-${users}" \
              --only-summary
          done
          uv run python scripts/summarize_staging_load.py \
            --input-dir artifacts/production_activation/load \
            --output artifacts/production_activation/load/summary.json \
            --image-digest "$IMAGE_DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.execute
        with:
          name: staging-smoke-results
          path: artifacts/production_activation/staging/smoke.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.execute
        with:
          name: staging-eval-baseline
          path: artifacts/production_activation/evals/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.execute
        with:
          name: staging-load-baseline
          path: artifacts/production_activation/load/
          if-no-files-found: warn
