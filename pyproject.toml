[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-graphrag"
version = "0.1.0"
description = "Hybrid GraphRAG system combining vector search and knowledge graph for company research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.140.13",
    "fastembed==0.8.0",
    "httpx>=0.27.0",
    "neo4j>=6.2.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27.0",
    "opik>=1.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.1",
    "qdrant-client>=1.9.0",
    "prometheus-client>=0.20.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "tiktoken>=0.7.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
company-graphrag = "company_graphrag.cli:main"

[dependency-groups]
dev = [
    "locust>=2.29.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/company_graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scratch", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "E402", "E722", "SIM", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true
