[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-intelligence-graphrag"
version = "0.1.0"
description = "Hybrid GraphRAG system combining vector search and a knowledge graph for citation-grounded, multi-hop company research."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]